<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Arial", sans-serif;
  }

  body {
    height: 100vh;
    background: #000;
    color: #fff;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Subtle moving gradient */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      120deg,
      #000,
      #111,
      #1a1a1a,
      #000
    );
    animation: bgMove 10s infinite linear;
    z-index: -1;
  }

  @keyframes bgMove {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(40deg); }
  }

  .container {
    text-align: center;
    animation: fadeIn 2s ease;
  }

  h1 {
    font-size: 4rem;
    letter-spacing: 3px;
    margin-bottom: 15px;
    animation: slideDown 1.5s ease;
  }

  h1 span {
    color: #00d4ff; /* subtle color accent */
  }

  .line {
    width: 120px;
    height: 3px;
    background: #fff;
    margin: 20px auto;
    animation: expand 1.5s ease forwards;
  }

  p {
    font-size: 1.2rem;
    opacity: 0.85;
    letter-spacing: 1px;
    animation: fadeIn 3s ease;
  }

  /* Floating light particles */
  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    opacity: 0.6;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    from {
      transform: translateY(100vh);
      opacity: 0;
    }
    to {
      transform: translateY(-10vh);
      opacity: 1;
    }
  }

  @keyframes slideDown {
    from { transform: translateY(-40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes expand {
    from { width: 0; }
    to { width: 120px; }
  }
</style>
</head>

<body>

<div class="container">
  <h1>HAPPY <span>BIRTHDAY</span></h1>
  <div class="line"></div>
  <p>Wishing you strength, success, and great moments ahead.</p>
</div>

<script>
  // Create subtle floating particles
  for (let i = 0; i < 60; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (5 + Math.random() * 5) + "s";
    p.style.animationDelay = Math.random() * 5 + "s";
    document.body.appendChild(p);
  }
</script>

</body>
</html>

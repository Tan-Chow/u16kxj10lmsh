<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Ashik</title>

<!-- Premium serif font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Playfair Display', serif;
}

body {
  height: 100vh;
  background: linear-gradient(
    135deg,
    #000000,
    #0b1c2d,
    #c9a24d,
    #ffffff
  );
  background-size: 400% 400%;
  animation: bgShift 12s ease infinite;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.container {
  text-align: center;
  z-index: 2;
}

h1 {
  font-size: 4rem;
  letter-spacing: 2px;
  font-weight: 700;
  animation: reveal 2s ease;
}

h1 span {
  color: gold;
}

@keyframes reveal {
  from { opacity: 0; transform: translateY(-40px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Wish line */
.container p {
  margin-top: 25px;
  font-size: 1.3rem;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.9);
  text-shadow:
    0 0 10px rgba(255,255,255,0.4),
    0 0 20px rgba(201,162,77,0.4);
}

/* Sparkles */
.sparkle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  opacity: 0.8;
  animation: sparkle 6s linear infinite;
}

@keyframes sparkle {
  from { transform: translateY(100vh); opacity: 0; }
  to { transform: translateY(-10vh); opacity: 1; }
}

/* Balloons */
.balloon {
  position: absolute;
  bottom: -150px;
  width: 60px;
  height: 80px;
  border-radius: 50% 50% 45% 45%;
  animation: float 10s linear infinite;
  box-shadow:
    inset -8px -12px 20px rgba(0,0,0,0.35),
    inset 6px 6px 15px rgba(255,255,255,0.25),
    0 12px 25px rgba(0,0,0,0.4);
  overflow: visible;
}

/* Shine */
.balloon::after {
  content: "";
  position: absolute;
  top: 10px;
  left: 14px;
  width: 16px;
  height: 26px;
  background: rgba(255,255,255,0.45);
  border-radius: 50%;
  transform: rotate(-20deg);
}

/* Knot */
.balloon::before {
  content: "";
  position: absolute;
  bottom: -6px;
  left: 50%;
  width: 10px;
  height: 8px;
  background: inherit;
  transform: translateX(-50%) rotate(45deg);
  border-radius: 2px;
}

/* Ribbon */
.balloon .string {
  position: absolute;
  top: 80px;
  left: 50%;
  width: 2px;
  height: 50px;
  background: rgba(255,255,255,0.6);
  transform: translateX(-50%);
}

/* Balloon colors */
.red {
  background: radial-gradient(circle at 30% 30%, #ff6b6b, #b71c1c);
}

.violet {
  background: radial-gradient(circle at 30% 30%, #c084fc, #6a1b9a);
}

.gold {
  background: radial-gradient(circle at 30% 30%, #ffe082, #c9a24d);
}

@keyframes float {
  from { transform: translateY(0); }
  to { transform: translateY(-130vh); }
}

/* Confetti */
.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body onclick="confettiBurst(event)">

  <div class="container">
    <h1>HAPPY BIRTHDAY, <span>ASHIK!</span></h1>
    <p>Wishing you strength, success, and great moments ahead.</p>
  </div>

<script>
// Sparkles
for (let i = 0; i < 80; i++) {
  const s = document.createElement("div");
  s.className = "sparkle";
  s.style.left = Math.random() * 100 + "vw";
  s.style.animationDuration = (4 + Math.random() * 6) + "s";
  document.body.appendChild(s);
}

// Balloons
const colors = ["red", "violet", "gold"];
for (let i = 0; i < 12; i++) {
  const b = document.createElement("div");
  b.className = "balloon " + colors[i % colors.length];

  const string = document.createElement("div");
  string.className = "string";
  b.appendChild(string);

  b.style.left = Math.random() * 100 + "vw";
  b.style.animationDuration = (8 + Math.random() * 6) + "s";
  document.body.appendChild(b);
}

// Confetti
function confettiBurst(e) {
  for (let i = 0; i < 25; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = e.clientX + "px";
    c.style.top = e.clientY + "px";
    c.style.background = `hsl(${Math.random()*360},100%,50%)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}
</script>

</body>
</html>

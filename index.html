<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Ashik</title>

<!-- Premium masculine font -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Montserrat', sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(
    135deg,
    #000000,
    #0b1c2d,
    #c9a24d,
    #ffffff
  );
  background-size: 400% 400%;
  animation: bgShift 12s ease infinite;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.container {
  text-align: center;
  z-index: 2;
}

h1 {
  font-size: 3.8rem;
  letter-spacing: 3px;
  animation: reveal 2s ease;
}

h1 span {
  color: gold;
}

@keyframes reveal {
  from { opacity: 0; transform: translateY(-40px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Sparkles */
.sparkle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  opacity: 0.8;
  animation: sparkle 6s linear infinite;
}

@keyframes sparkle {
  from { transform: translateY(100vh); opacity: 0; }
  to { transform: translateY(-10vh); opacity: 1; }
}

/* Balloons */
.balloon {
  position: absolute;
  bottom: -150px;
  width: 60px;
  height: 80px;
  border-radius: 50%;
  animation: float 10s linear infinite;
}

.red { background: #d32f2f; }
.violet { background: #7b1fa2; }

@keyframes float {
  from { transform: translateY(0); }
  to { transform: translateY(-130vh); }
}

/* Confetti */
.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  animation: fall 3s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body onclick="confettiBurst(event)">

<div class="container">
  <h1>HAPPY BIRTHDAY, <span>ASHIK!</span></h1>
</div>

<script>
// Sparkles
for (let i = 0; i < 80; i++) {
  const s = document.createElement("div");
  s.className = "sparkle";
  s.style.left = Math.random() * 100 + "vw";
  s.style.animationDuration = (4 + Math.random() * 6) + "s";
  document.body.appendChild(s);
}

// Balloons
const colors = ["red", "violet"];
for (let i = 0; i < 12; i++) {
  const b = document.createElement("div");
  b.className = "balloon " + colors[i % 2];
  b.style.left = Math.random() * 100 + "vw";
  b.style.animationDuration = (8 + Math.random() * 6) + "s";
  document.body.appendChild(b);
}

// Confetti on click
function confettiBurst(e) {
  for (let i = 0; i < 25; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = e.clientX + "px";
    c.style.top = e.clientY + "px";
    c.style.background = `hsl(${Math.random()*360},100%,50%)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}
</script>

</body>
</html>
